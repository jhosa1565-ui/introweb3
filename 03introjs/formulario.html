<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma de números</title>
</head>

<body>

    <h2>Sumas</h2>

    <form>
        <table>
            <tr>
                <td>Número 1:</td>
                <td>
                    <input type="number" id="txtNum1" />
                </td>
            </tr>
            <tr>
                <td>Número 2:</td>
                <td>
                    <input type="number" id="txtNum2" />
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <!-- Se especifica type="button" para evitar que el formulario se recargue -->
                    <button type="button" id="botonsumar">Sumar</button>
                </td>
            </tr>
        </table>
    </form>

    <script>
        document.getElementById('botonsumar').addEventListener('click', function () {
            // parseFloat convierte el texto ingresado en un número decimal
            var num1 = parseFloat(document.getElementById("txtNum1").value) || 0;
            var num2 = parseFloat(document.getElementById("txtNum2").value) || 0;

            var result = num1 + num2;

            alert("El resultado es: " + result);
        });
    </script>

</body>

</html>
