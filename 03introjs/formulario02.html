<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Sumas</h2>

    <form id="formulario">
        <table>
            <tr>
                <td>Nombres:</td>
                <td>
                    <input id="txtNombres" type="text" required>
                </td>
            </tr>
            <tr>
                <td>Apellidos:</td>
                <td>
                    <input id="txtApellidos" type="text" required>
                </td>
            </tr>
            <tr>
                <td>Correo:</td>
                <td>
                    <input id="txtCorreo" type="email" required>
                </td>
            </tr>
            <tr>
                <td>Edad:</td>
                <td>
                    <input id="txtEdad" type="number" required>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <button id="btnRegistrar">Registrar</button>
                </td>
            </tr>
        </table>
    </form>

    <h3>
        Persona registrada
    </h3>

    <div id="resultado">
        Ninguna
    </div>

</body>
</html>

<script>
    const form = document.getElementById('formulario');
    form.addEventListener('submit', function(e) {
        e.preventDefault(); // Evita que se recarge la pagina
        var nombres = document.getElementById("txtNombres").value;
        var apellidos = document.getElementById("txtApellidos").value;
        var correo = document.getElementById("txtCorreo").value;
        var edad = document.getElementById("txtEdad").value;

        document.getElementById("resultado").innerHTML = "Nombre: "+nombres;
    });
</script>
